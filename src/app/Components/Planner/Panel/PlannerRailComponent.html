@for (panel of layout.registered(); track panel.id) {
	<button
		class="rail-btn"
		[class.active]="layout.isOpen(panel.id)"
		type="button"
		[tooltip]="panel.label + hotkeys.suffix(panel.hotkey)"
		placement="right"
		[attr.aria-label]="panel.label + hotkeys.suffix(panel.hotkey)"
		(click)="layout.toggleFromRail(panel.id)"
	><fa-icon [icon]="panel.icon"></fa-icon></button>
}

<!-- The wrapper span carries the tooltip: a disabled button has no pointer events of its own. -->
<div class="rail-sep"></div>
<button
	class="rail-btn rail-btn-new"
	type="button"
	[tooltip]="'New plan' + hotkeys.suffix('plans.newPlan')"
	placement="right"
	[attr.aria-label]="'New plan' + hotkeys.suffix('plans.newPlan')"
	(click)="planCreator.createPlan()"
><fa-icon [icon]="faPlus"></fa-icon></button>
@if (features.shareLinks) {
	<span [tooltip]="shareTooltip()" placement="right">
		<button
			class="rail-btn rail-btn-accent"
			type="button"
			[disabled]="shareDialog.activeTarget() === null"
			[attr.aria-label]="shareTooltip()"
			(click)="shareDialog.openActive()"
		><fa-icon [icon]="faShareNodes"></fa-icon></button>
	</span>
}
