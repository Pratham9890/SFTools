<div class="line-split-backdrop" hotkeyBlock>
	<form class="line-split-dialog card" (ngSubmit)="apply()">
		<div class="card-header d-flex align-items-start gap-2">
			<span class="fw-semibold flex-grow-1">Split {{ itemName }} into lines</span>
			<button type="button" class="btn-close" aria-label="Close" (click)="close.emit()"></button>
		</div>

		<div class="p-3 d-flex flex-column gap-3" style="overflow-y: auto;">
			@if (plan; as linePlan) {
				<div>
					<div class="form-label small mb-1">Machines</div>
					<div class="form-check">
						<input
							class="form-check-input"
							type="radio"
							name="line-split-style"
							id="line-split-full"
							[checked]="style === 'full'"
							(change)="selectStyle('full')"
						/>
						<label class="form-check-label" for="line-split-full">Full machines, underclock the last</label>
					</div>
					<div class="form-check">
						<input
							class="form-check-input"
							type="radio"
							name="line-split-style"
							id="line-split-even"
							[checked]="style === 'even'"
							(change)="selectStyle('even')"
						/>
						<label class="form-check-label" for="line-split-even">Underclock all evenly</label>
					</div>
				</div>

				<div class="p-2 rounded d-flex flex-column gap-1" style="background: rgba(255, 255, 255, 0.04);">
					@for (line of linePlan.lines; track $index) {
						<div class="small">
							<span class="text-secondary">Line {{ $index + 1 }} · {{ rate(line.flow) }} ·</span>
							{{ lineText(line) }}
						</div>
					}
					<div class="small text-secondary">{{ totalsText }}</div>
					<div class="small text-secondary">{{ powerText }}</div>
				</div>
			} @else {
				<div class="small text-secondary">{{ blocked }}</div>
			}
		</div>

		<div class="card-footer d-flex justify-content-end gap-2">
			<button type="button" class="btn btn-sm btn-outline-secondary" (click)="close.emit()">Cancel</button>
			<button type="submit" class="btn btn-sm btn-primary" [disabled]="plan === null">Apply</button>
		</div>
	</form>
</div>
