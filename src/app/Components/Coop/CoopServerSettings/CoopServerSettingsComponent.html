<section class="pp-stack server-form">
	<div class="pp-row server-fields">
		<div class="pp-field grow">
			<label class="pp-label small" for="coop-server-address">Server address</label>
			<input id="coop-server-address" class="form-control form-control-sm" type="url" autocomplete="off" spellcheck="false" placeholder="https://your-project.supabase.co" [(ngModel)]="serverAddress" (keydown.enter)="save()"/>
		</div>
		<div class="pp-field grow">
			<label class="pp-label small" for="coop-server-key">Public key</label>
			<input id="coop-server-key" class="form-control form-control-sm" type="text" autocomplete="off" spellcheck="false" [(ngModel)]="publicKey" (keydown.enter)="save()"/>
		</div>
		<div class="pp-row server-actions">
			<button type="button" class="btn btn-success btn-sm" (click)="save()">Save</button>
			<button type="button" class="btn btn-outline-secondary btn-sm" (click)="clear()">Clear</button>
		</div>
	</div>
	@if (error(); as message) {
		<p class="text-danger small mb-0">{{ message }}</p>
	} @else if (saved()) {
		<p class="text-success small mb-0">Server saved.</p>
	}
	<p class="pp-note mb-0">To host your own, follow the guide in the README.</p>
</section>
